name: Deploy Dynamic Worlds to tModLoader

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dynamic-worlds-local-tmodloader
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test deployment and live-validation safeguards
        run: python3 -m unittest discover -s tests -v

  deploy:
    needs: verify
    if: >-
      github.repository == 'Uncanny-Abyss-Interactive/TerrariaDynamicWorlds' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, dynamic-worlds-tmodloader]
    timeout-minutes: 35
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Skip superseded commits
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main commit is queued; skipping this deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build, test in live Terraria, and deploy the exact commit
        if: steps.tip.outputs.current == 'true'
        env:
          PYTHONUNBUFFERED: '1'
          # Native ARM64 .NET 8 avoids Rosetta failures in the bundled x64 host.
          DW_DOTNET: /usr/local/share/dotnet/dotnet
        run: python3 scripts/deploy.py --commit "$GITHUB_SHA" --artifacts-dir artifacts

      - name: Retain package, live-test reports, screenshot, and logs
        if: always() && steps.tip.outputs.current == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DynamicWorlds-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
